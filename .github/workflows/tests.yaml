name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # poetry-dynamic-versioning needs tags/history to compute the version
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        # pybedtools requires the bedtools CLI to be installed separately
        run: |
          sudo apt-get update
          sudo apt-get install -y bedtools

      - name: Install Poetry
        uses: Gr1N/setup-poetry@v8
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Pre-seed setuptools/wheel into the Poetry venv
        # Needed because pybedtools has a legacy setup.py that does
        # `import setuptools` directly. Python 3.12's venv module no
        # longer bundles setuptools/wheel by default, so without this
        # step the build fails with "setuptools was not found".
        run: |
          poetry env use python${{ matrix.python-version }}
          poetry run pip install --upgrade pip setuptools wheel

      - name: Install package and dev dependencies
        run: poetry install --with dev --no-interaction

      - name: Run tests
        run: poetry run pytest tests/ -v
